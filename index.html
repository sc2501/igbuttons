document.getElementById('sheetClose').onclick=function(){sheet.close();};
function frename(id){var f=fget(id);if(!f)return;var v=prompt('資料夾名稱',f.name);if(v&&v.trim()){f.name=v.trim().slice(0,40);fsave();frender();}}
function fdelete(id){var f=fget(id);if(!f)return;if(confirm('刪除資料夾「'+f.name+'」？（裡面的地點不會被刪除）')){folders=folders.filter(function(x){return x.id!==id;});fsave();if(curF===id){fview.classList.remove('open');curF=null;}frender();}}
function fmenu(id){var f=fget(id);if(!f)return;openSheet(f.name,[['✏️ 重新命名',function(){frename(id);}],['🔗 貼上連結加入地點',function(){var v=prompt('貼上 IG／Google 地圖／網頁連結');if(v)linkToFolder(v,id);}],['🗑️ 刪除資料夾',function(){fdelete(id);}]]);}
function toast(t){var g=document.getElementById('ghost');g.textContent=t;g.style.display='block';g.style.left='50%';g.style.top='50%';g.style.transform='translate(-50%,-50%)';clearTimeout(toast.t);toast.t=setTimeout(function(){g.style.display='none';g.style.transform='';},1800);}
function linkToFolder(v,fid){var m=String(v).match(/https?:\/\/\S+/);if(!m){toast('沒有找到網址');return;}if(!RESOLVER_URL){toast('連結判讀服務未設定');return;}
 toast('讀取連結中…');
 fetch(RESOLVER_URL+'?url='+encodeURIComponent(m[0])).then(function(r){return r.json();}).then(function(o){var ps=(o&&o.places)||[];if(!ps.length){toast('這個連結找不到地點');return;}
  var t=Date.now(),ids=[],added=[];ps.forEach(function(x,i){var d=dupOf(x);if(d){ids.push(d.id);return;}
   var q={id:'p'+t+'_'+i,name:x.name,address:x.address==='未確認'?'':(x.address||''),note:x.note||'',category:x.category||'餐廳',sourceUrl:x.sourceUrl||'',sourceTitle:x.sourceTitle||'',author:x.author||'',link:x.link||'',hours:x.hours||'未確認',closed:x.closed||'未確認',service:x.service||'未確認',extra:x.extra||'',hoursSrc:x.hoursSrc||'',closedSrc:x.closedSrc||'',serviceSrc:x.serviceSrc||'',extraSrc:x.extraSrc||'',verified:x.verified||'',goshuin:/寺|神社|神宮|稲荷|稻荷|大社/.test(x.name)?'未確認':''};
   if(typeof x.lat==='number'){q.lat=x.lat;q.lng=x.lng;}q.region=regionOf(q);places.push(q);added.push(q);ids.push(q.id);});
  save();fadd(fid,ids);render();frender();queueP(added);toast('已加入 '+ids.length+' 個地點到「'+(fget(fid)||{}).name+'」');})
 .catch(function(e){toast('讀取失敗：'+e.message);});}
function pickFolder(pids,pre){if(!Array.isArray(pids))pids=[pids];pids=pids.filter(function(id){return places.some(function(x){return x.id===id;});});if(!pids.length)return;var pid=pids[0],p=places.find(function(x){return x.id===pid;}),ttl=pids.length>1?pids.length+' 個地點':'「'+p.name+'」';var sel=pre||null;
 function draw(){sheetBody.innerHTML='<h3 style="margin:4px 0 8px">把'+esc(ttl)+'加入資料夾</h3><div class="chooser">'+folders.map(function(f){var inF=pids.every(function(x){return f.ids.indexOf(x)>=0;});return '<button type="button" data-cf="'+esc(f.id)+'" class="'+(sel===f.id?'on':'')+'">'+(sel===f.id?'◉ ':'○ ')+esc(f.name)+(inF?'<span style="color:#9aa0a6;font-size:13px">（已在裡面）</span>':'')+'</button>';}).join('')+
  '<button type="button" data-cf="__new">＋ 新資料夾…</button></div><div class="row" style="margin:8px 0 4px"><button type="button" id="cfOk" style="background:'+(sel?'#4285f4':'#3c4048')+';color:#fff"'+(sel?'':' disabled')+'>加入</button></div>';}
 draw();sheetBody.onclick=function(e){var b=e.target.closest('[data-cf]');if(b){var v=b.getAttribute('data-cf');if(v==='__new'){var f=fnew(prompt('新資料夾名稱'));if(f){sel=f.id;frender();}}else sel=v;draw();return;}
  if(e.target.id==='cfOk'&&sel){var f=fget(sel);sheet.close();var n=fadd(sel,pids);frender();toast(n?'已加入 '+n+' 個地點到「'+f.name+'」':'「'+f.name+'」裡已經有'+(pids.length>1?'這些':'這個')+'地點');if(selMode)selExit();}};
 sheet.open||sheet.showModal();}
document.getElementById('foldBtn').onclick=fopen;
var selMode=false,selSet={};
function selVis(){return Array.prototype.map.call(document.querySelectorAll('#list .place[data-pid]'),function(el){return el.getAttribute('data-pid');});}
function selPaint(){var n=Object.keys(selSet).length,vis=selVis();document.querySelectorAll('#list .place[data-pid]').forEach(function(el){el.classList.toggle('sel',!!selSet[el.getAttribute('data-pid')]);});
 document.getElementById('selCnt').textContent='已選 '+n;var all=vis.length&&vis.every(function(id){return selSet[id];});document.getElementById('selAll').textContent=all?'取消全選':'全選';document.getElementById('selAdd').disabled=!n;}
function selExit(){selMode=false;selSet={};document.body.classList.remove('selmode');document.getElementById('selBtn').classList.remove('on');selPaint();}
document.getElementById('selBtn').onclick=function(){if(selMode){selExit();return;}selMode=true;selSet={};document.body.classList.add('selmode');this.classList.add('on');selPaint();};
document.getElementById('selDone').onclick=selExit;
document.getElementById('selAll').onclick=function(){var vis=selVis(),all=vis.length&&vis.every(function(id){return selSet[id];});vis.forEach(function(id){if(all)delete selSet[id];else selSet[id]=1;});selPaint();};
document.getElementById('selAdd').onclick=function(){var ids=Object.keys(selSet);if(ids.length)pickFolder(ids);};
document.getElementById('list').addEventListener('click',function(e){if(!selMode)return;var pl=e.target.closest('.place[data-pid]');if(!pl||e.target.closest('.del,.fbtn'))return;e.preventDefault();e.stopPropagation();var id=pl.getAttribute('data-pid');if(selSet[id])delete selSet[id];else selSet[id]=1;selPaint();},true);
new MutationObserver(function(){if(selMode)selPaint();}).observe(document.getElementById('list'),{childList:true});
(function(){var tab=document.getElementById('ftab'),st=null;
 tab.addEventListener('pointerdown',function(e){st={x:e.clientX,moved:false};tab.setPointerCapture(e.pointerId);frender();foldEl.classList.add('drag');});
 tab.addEventListener('pointermove',function(e){if(!st)return;var dx=Math.min(0,e.clientX-st.x);if(dx<-6)st.moved=true;if(st.moved)foldEl.style.transform='translateX('+(window.innerWidth+dx)+'px)';});
 function end(e){if(!st)return;var dx=e.clientX-st.x,m=st.moved;st=null;foldEl.classList.remove('drag');
  if(!m||dx<-window.innerWidth*0.3)fopen();else foldEl.style.transform='';}
 tab.addEventListener('pointerup',end);tab.addEventListener('pointercancel',function(){st=null;foldEl.classList.remove('drag');foldEl.style.transform='';});})();
document.getElementById('foldBack').onclick=fclose;
document.getElementById('fvBack').onclick=function(){fview.classList.remove('open');curF=null;frender();};
document.getElementById('fvMenu').onclick=function(){if(curF)fmenu(curF);};
document.getElementById('fFab').onclick=function(){if(fnew(prompt('新資料夾名稱')))frender();};
document.getElementById('fvList').onclick=function(e){var id=e.target.getAttribute('data-out');if(!id||!curF)return;var f=fget(curF);f.ids=f.ids.filter(function(x){return x!==id;});fsave();fvRender();};
// card tap / long-press
var lpT=null,lpFired=false;
fstack.addEventListener('pointerdown',function(e){var c=e.target.closest('.fcard[data-fid]');if(!c)return;lpFired=false;clearTimeout(lpT);lpT=setTimeout(function(){lpFired=true;fmenu(c.getAttribute('data-fid'));},550);});
['pointerup','pointercancel','pointerleave'].forEach(function(ev){fstack.addEventListener(ev,function(){clearTimeout(lpT);});});
fstack.addEventListener('scroll',function(){clearTimeout(lpT);},{passive:true});
fstack.addEventListener('contextmenu',function(e){if(e.target.closest('.fcard'))e.preventDefault();});
fstack.addEventListener('click',function(e){if(lpFired){lpFired=false;return;}if(e.target.closest('#fAddCard')){if(fnew(prompt('新資料夾名稱')))frender();return;}
 var nm=e.target.getAttribute('data-fname');if(nm){frename(nm);return;}var c=e.target.closest('.fcard[data-fid]');if(c)fshow(c.getAttribute('data-fid'));});
// desktop drop on cards (place or link)
function dropTarget(el){var c=el&&el.closest&&el.closest('[data-fid],[data-tf]');return c?(c.getAttribute('data-fid')||c.getAttribute('data-tf')):null;}
function handleDrop(fid,dt){var pid=dt.getData('application/x-igb-place');if(pid){try{pid=JSON.parse(pid);}catch(e){}pickFolder(pid,fid==='__new'?null:fid);return;}
 var t=dt.getData('text/uri-list')||dt.getData('text/plain');if(t)linkToFolder(t,fid);}
[fstack,document.getElementById('tray')].forEach(function(el){
 el.addEventListener('dragover',function(e){if(dropTarget(e.target)){e.preventDefault();document.querySelectorAll('.hot').forEach(function(x){x.classList.remove('hot');});e.target.closest('[data-fid],[data-tf]').classList.add('hot');}});
 el.addEventListener('drop',function(e){var fid=dropTarget(e.target);if(!fid)return;e.preventDefault();document.querySelectorAll('.hot').forEach(function(x){x.classList.remove('hot');});trayHide();handleDrop(fid,e.dataTransfer);});});
var tray=document.getElementById('tray');
function trayShow(){tray.innerHTML=folders.map(function(f){return '<div class="tc" data-tf="'+esc(f.id)+'">📁 '+esc(f.name)+'</div>';}).join('')+'<div class="tc" data-tf="__new">＋ 新資料夾</div>';tray.classList.add('show');}
function trayHide(){tray.classList.remove('show');}
var listEl=document.getElementById('list');
listEl.addEventListener('dragstart',function(e){var pl=e.target.closest&&e.target.closest('[data-pid]');if(!pl)return;var did=pl.getAttribute('data-pid');e.dataTransfer.setData('application/x-igb-place',JSON.stringify(selMode&&selSet[did]?Object.keys(selSet):[did]));e.dataTransfer.effectAllowed='copy';trayShow();});
listEl.addEventListener('dragend',function(){setTimeout(trayHide,50);});
// touch long-press drag
var tD=null;
listEl.addEventListener('touchstart',function(e){var pl=e.target.closest('[data-pid]');if(!pl||e.target.closest('.del,.fbtn'))return;var t0=e.touches[0];
 var tp=pl.getAttribute('data-pid');tD={pid:selMode&&selSet[tp]?Object.keys(selSet):tp,x:t0.clientX,y:t0.clientY,on:false,tm:setTimeout(function(){tD.on=true;trayShow();var g=document.getElementById('ghost'),ids=Array.isArray(tD.pid)?tD.pid:[tD.pid],p=places.find(function(q){return q.id===ids[0];});g.innerHTML='📍 '+esc(p?p.name:'')+(ids.length>1?'<span class="badge">×'+ids.length+'</span>':'');g.style.transform='';g.style.display='block';g.style.left=(tD.x-40)+'px';g.style.top=(tD.y-30)+'px';if(navigator.vibrate)navigator.vibrate(20);},450)};},{passive:true});
listEl.addEventListener('touchmove',function(e){if(!tD)return;var t=e.touches[0];
 if(!tD.on){if(Math.abs(t.clientX-tD.x)>10||Math.abs(t.clientY-tD.y)>10){clearTimeout(tD.tm);tD=null;}return;}
 e.preventDefault();var g=document.getElementById('ghost');g.style.left=(t.clientX-40)+'px';g.style.top=(t.clientY-50)+'px';tD.x=t.clientX;tD.y=t.clientY;
 var el=document.elementFromPoint(t.clientX,t.clientY);document.querySelectorAll('#tray .hot').forEach(function(x){x.classList.remove('hot');});var c=el&&el.closest&&el.closest('[data-tf]');if(c)c.classList.add('hot');},{passive:false});
function tEnd(){if(!tD)return;clearTimeout(tD.tm);if(tD.on){var el=document.elementFromPoint(tD.x,tD.y),c=el&&el.closest&&el.closest('[data-tf]');document.getElementById('ghost').style.display='none';trayHide();
  if(c){var fid=c.getAttribute('data-tf');pickFolder(tD.pid,fid==='__new'?null:fid);}
  tD.block=true;var b=tD;setTimeout(function(){if(tD===b)tD=null;},400);return;}tD=null;}
listEl.addEventListener('touchend',tEnd);listEl.addEventListener('touchcancel',tEnd);
listEl.addEventListener('click',function(e){if(tD&&tD.block){e.preventDefault();e.stopPropagation();tD=null;}},true);
listEl.addEventListener('contextmenu',function(e){if(e.target.closest('[data-pid]'))e.preventDefault();});
tray.addEventListener('click',function(e){var c=e.target.closest('[data-tf]');if(c&&c.getAttribute('data-tf')==='__new'){var f=fnew(prompt('新資料夾名稱'));if(f){trayShow();}}});
// swipe left on main → folders; swipe right on folders → back
var sw=null;
document.addEventListener('touchstart',function(e){if(e.touches.length!==1||e.target.closest('input,.chips,#tray,dialog,#ftab'))return sw=null;sw={x:e.touches[0].clientX,y:e.touches[0].clientY,t:Date.now()};},{passive:true});
document.addEventListener('touchend',function(e){if(!sw||(tD&&tD.on))return;var t=e.changedTouches[0],dx=t.clientX-sw.x,dy=t.clientY-sw.y;sw=null;
 if(Math.abs(dx)<70||Math.abs(dy)>50)return;
 if(dx<0&&!foldEl.classList.contains('open'))fopen();else if(dx>0&&foldEl.classList.contains('open')){if(fview.classList.contains('open')){fview.classList.remove('open');curF=null;frender();}else fclose();}},{passive:true});
render();
pullEnrich();
if(location.hash==='#folders')fopen();
if(navigator.permissions&&navigator.permissions.query){navigator.permissions.query({name:'geolocation'}).then(function(st){if(st.state==='granted')locateQuiet();}).catch(function(){});}
places.forEach(geocode);
})();
